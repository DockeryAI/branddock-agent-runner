name: Verify Build
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
        if: contains(github.event.head_commit.message, 'node') || hashFiles('package.json') != ''
      - run: bash check.sh
