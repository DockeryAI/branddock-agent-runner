name: Spec Sync Guard (Autocalc)
on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node scripts/sync-spec.mjs
      - name: Fail if spec changed
        run: |
          if ! git diff --quiet -- docs/brandock-spec.md; then
            echo "::error ::Spec drifted; run sync locally and commit."
            git --no-pager diff -- docs/brandock-spec.md
            exit 1
          fi
